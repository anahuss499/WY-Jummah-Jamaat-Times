<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran | West Yorkshire Jummah</title>
<meta name="description" content="Read the complete Quran in Arabic Indo-Pak script.">
<link rel="icon" type="image/png" href="assets/images/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quran.css">
</head>
<body>
<nav class="reader-nav" aria-label="Site navigation">
  <a href="index.html">Jummah times</a>
  <a class="active" href="quran.html">Quran</a>
  <a href="durood.html">Durood counter</a>
</nav>
<header class="reader-header">
  <img src="assets/images/Logo.png" alt="Mosque arches">
  <div>
    <p class="eyebrow">Arabic only · Indo-Pak script</p>
    <h1>القرآن الكريم</h1>
    <p class="reader-subtitle">The complete Quran</p>
  </div>
</header>
<main class="quran-shell">
  <section class="reader-tools" aria-label="Quran controls">
    <label class="search-wrap" for="quranSearch">
      <span aria-hidden="true">⌕</span>
      <input id="quranSearch" type="search" placeholder="Search surah or Arabic text" autocomplete="off">
    </label>
    <label class="surah-select-wrap" for="surahSelect">سورة
      <select id="surahSelect"><option value="">All surahs</option></select>
    </label>
  </section>
  <p class="reader-status" id="readerStatus" role="status">Loading the complete Quran...</p>
  <div id="quranContent"></div>
</main>
<script src="quran.js"></script>
</body>
</html>
